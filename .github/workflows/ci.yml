name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: el CLI funciona de punta a punta
        run: |
          govkit --help
          govkit observability render --project demo --channel projects/demo/notificationChannels/1 --out out
          test -f out/dashboards/service-detail.json
