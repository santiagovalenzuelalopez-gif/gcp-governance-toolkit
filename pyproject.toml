[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govkit"
version = "1.0.0"
description = "Gobernanza como código para microservicios en Cloud Run: verificador de estándar y observabilidad (alertas, dashboards, presupuesto) generada."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
govkit = "govkit.cli:main"

[tool.setuptools.packages.find]
include = ["govkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
